name: Validate PrusaSlicer profiles

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate profiles
        run: python scripts/validate-profiles.py
      - name: Rebuild bundle
        run: python scripts/build-bundle.py
